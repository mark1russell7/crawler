name: Bug report
description: polite-crawler does something wrong, or stops with an error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. For a security problem, do not open an issue. Use the private report of the Security tab (refer to SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got. Include the full error message.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command, the MCP tool call or the code. Give a public URL if a page causes the problem.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - The command line
        - The MCP server
        - The library
        - The site
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: polite-crawler version
      description: The output of `npx polite-crawler --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`. polite-crawler needs 22.19 or later.
      placeholder: v24.21.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 26, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: capture
    attributes:
      label: Capture id
      description: If the problem is about one fetch, the capture id from the store or from `--json` output.
  - type: textarea
    id: more
    attributes:
      label: Other information
      description: The MCP client, the renderer (`playwright-core` version), logs.
