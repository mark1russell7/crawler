# The search benchmark (finding S-30): a synthetic index of 30,000 documents, the time of find and
# rankWithin in each ranking mode, and the quality of each mode against exact ranking.
# It runs only when a person starts it, because a shared runner gives numbers for a comparison, not a gate.
#   gh workflow run bench.yml -R mark1russell7/crawler --ref <branch>
# The JSON results are the artifact bench-find-node<version>. The job summary has the table.
# With hybrid, it also times hybrid search over the same index: a fake embedder gives the vectors,
# so the times are those of the chunks, the vector store, the cosine and the fusion (time only).
name: Bench

on:
  workflow_dispatch:
    inputs:
      docs:
        description: The number of synthetic documents
        default: "30000"
      runs:
        description: The timed runs of each question
        default: "5"
      modes:
        description: A comma list of modes (empty for each mode). exact always runs.
        default: ""
      corpus:
        description: zipf (a Zipf spread with topics) or dense (the corpus of the review)
        default: zipf
      hybrid:
        description: Also time hybrid search (rank hybrid) with a fake embedder
        type: boolean
        default: false
      dims:
        description: The dimensions of the vectors of the hybrid mode
        default: "384"

permissions:
  contents: read

jobs:
  find:
    name: find and rankWithin (Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the floor of "engines". Its SQLite is older than the SQLite of Node.js 24.
        node: ["22.19.0", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the benchmark
        shell: bash
        env:
          DOCS: ${{ inputs.docs }}
          RUNS: ${{ inputs.runs }}
          MODES: ${{ inputs.modes }}
          CORPUS: ${{ inputs.corpus }}
          HYBRID: ${{ inputs.hybrid && '--hybrid' || '' }}
          DIMS: ${{ inputs.dims }}
        run: >-
          pnpm exec tsx packages/polite-crawler/bench/find.mts
          --docs "$DOCS" --runs "$RUNS" --modes "$MODES" --corpus "$CORPUS"
          --dims "$DIMS" $HYBRID
          --out bench-find.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-find-${{ inputs.corpus || 'zipf' }}-node${{ matrix.node }}
          path: bench-find.json
          retention-days: 90
