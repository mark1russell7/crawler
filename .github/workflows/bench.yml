# The search benchmark (finding S-30): a synthetic index of 30,000 documents, the time of find and
# rankWithin in each ranking mode, and the quality of each mode against exact ranking.
# It runs only when a person starts it, because a shared runner gives numbers for a comparison, not a gate.
#   gh workflow run bench.yml -R mark1russell7/crawler --ref <branch>
# The JSON results are the artifact bench-find-node<version>. The job summary has the table.
name: Bench

on:
  workflow_dispatch:
    inputs:
      docs:
        description: The number of synthetic documents
        default: "30000"
      runs:
        description: The timed runs of each question
        default: "5"
      modes:
        description: A comma list of modes (empty for each mode). exact always runs.
        default: ""

permissions:
  contents: read

jobs:
  find:
    name: find and rankWithin (Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the floor of "engines". Its SQLite is older than the SQLite of Node.js 24.
        node: ["22.19.0", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the benchmark
        shell: bash
        env:
          DOCS: ${{ inputs.docs }}
          RUNS: ${{ inputs.runs }}
          MODES: ${{ inputs.modes }}
        run: >-
          pnpm exec tsx packages/polite-crawler/bench/find.mts
          --docs "$DOCS" --runs "$RUNS" --modes "$MODES"
          --out bench-find.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-find-node${{ matrix.node }}
          path: bench-find.json
          retention-days: 90
