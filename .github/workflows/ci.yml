# The gates of each change.
#   test    the tests and the smoke test of the packed package, on each supported Node.js version and OS
#   checks  the checks that give the same result everywhere: types, code lint, prose lint, the site build
# release.yml calls this workflow before it builds a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Each Monday. The smoke test installs the tarball with the newest versions of its dependencies.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels the old run. Each commit on main gets its full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.19.0 is the floor of "engines": its SQLite has FTS5, and undici 8 needs it.
        node: ["22.19.0", "24", "26"]
        include:
          - os: windows-latest
            node: "24"
          - os: macos-latest
            node: "24"
          # This adds the coverage step to the ubuntu-latest and Node.js 24 job.
          - os: ubuntu-latest
            node: "24"
            coverage: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # One browser folder on each OS. .cache/ is in .gitignore.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The browser for the renderer test. Without one, the test skips and proves nothing.
      - name: The version of playwright-core
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('./packages/polite-crawler/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # On Linux, --with-deps also installs the system libraries of the browser.
      - name: Install the headless shell
        run: pnpm --filter polite-crawler exec playwright-core install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium-headless-shell

      - run: pnpm test

      # The thresholds are in packages/polite-crawler/vitest.config.ts.
      - name: Coverage
        if: matrix.coverage
        run: pnpm --filter polite-crawler test:coverage
      - name: Upload the coverage report
        if: matrix.coverage && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: packages/polite-crawler/coverage/
          if-no-files-found: ignore
          retention-days: 14

      # The archive tools read the exports of src/archive.test.ts: warcio reads the WARC files,
      # py-wacz the WACZ file, and zipfile each ZIP (also one with Zip64 records). Pinned versions.
      - name: Validate the WARC and WACZ exports
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        env:
          POLITE_CRAWLER_ARCHIVE_OUT: ${{ runner.temp }}/archives
        run: |
          python3 -m venv "$RUNNER_TEMP/archive-tools"
          . "$RUNNER_TEMP/archive-tools/bin/activate"
          pip install --disable-pip-version-check --quiet warcio==1.8.1 wacz==0.6.0 cdxj-indexer==1.4.6 frictionless==5.15.6 boilerpy3==1.0.7 shortuuid==1.0.13 jsonlines==4.0.0
          pnpm --filter polite-crawler exec vitest run src/archive.test.ts
          cd "$POLITE_CRAWLER_ARCHIVE_OUT"
          for file in *.warc.gz; do
            warcio check -v "$file"
            warcio index -f warc-type,warc-target-uri,http:status,offset,length "$file" > "$file.index"
            echo "$file: $(wc -l < "$file.index") records"
            cat "$file.index"
          done
          for file in *.wacz; do wacz validate -f "$file"; done
          python3 -I - *.wacz *.zip <<'EOF'
          import sys, zipfile
          for name in sys.argv[1:]:
              with zipfile.ZipFile(name) as archive:
                  bad = archive.testzip()
                  assert bad is None, f"{name}: the CRC of {bad} is wrong"
                  for info in archive.infolist():
                      print(name, info.filename, info.compress_type, info.file_size, info.CRC)
          EOF

      # The npm build, packed and installed into an empty project the way a user gets it
      - run: pnpm --filter polite-crawler build
      - run: node scripts/smoke.mjs

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier: the code, the JSON and the YAML. .prettierignore names what it does not format.
      - run: pnpm format:check
      - run: pnpm typecheck
      # oxlint, with the type-aware rules (no-floating-promises, no-misused-promises)
      - run: pnpm lint
      # The writing rules (ASD-STE100) of the README files and the doc comments
      - run: pnpm lint:ste
      # A change to the site fails here, and not later in the Pages deployment.
      - name: Build the site
        run: pnpm --filter @crawler/site run build
        env:
          SITE_BASE: /crawler
          ASTRO_TELEMETRY_DISABLED: "1"
      # The site check opens each page of the build in a browser: the links, the width on a phone, the console.
      - name: The version of playwright-core
        id: playwright
        run: echo "version=$(node -p "require('./packages/site/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the headless shell
        run: pnpm --filter @crawler/site exec playwright-core install --with-deps chromium-headless-shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      - name: Check the site
        run: pnpm --filter @crawler/site run check
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
