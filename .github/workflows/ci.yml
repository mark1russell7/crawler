# The gates of each change.
#   test    the tests and the smoke test of the packed package, on each supported Node.js version and OS
#   checks  the checks that give the same result everywhere: types, code lint, prose lint, the site build
# release.yml calls this workflow before it builds a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Each Monday. The smoke test installs the tarball with the newest versions of its dependencies.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels the old run. Each commit on main gets its full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.19.0 is the floor of "engines": its SQLite has FTS5, and undici 8 needs it.
        node: ["22.19.0", "24", "26"]
        include:
          - os: windows-latest
            node: "24"
          - os: macos-latest
            node: "24"
          # This adds the coverage step to the ubuntu-latest and Node.js 24 job.
          - os: ubuntu-latest
            node: "24"
            coverage: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # One browser folder on each OS. .cache/ is in .gitignore.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The browser for the renderer test. Without one, the test skips and proves nothing.
      - name: The version of playwright-core
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('./packages/polite-crawler/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # On Linux, --with-deps also installs the system libraries of the browser.
      - name: Install the headless shell
        run: pnpm --filter polite-crawler exec playwright-core install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium-headless-shell

      - run: pnpm test

      # The coverage does not fail the job yet. The thresholds are in packages/polite-crawler/vitest.config.ts.
      - name: Coverage
        if: matrix.coverage
        continue-on-error: true
        run: pnpm --filter polite-crawler test:coverage
      - name: Upload the coverage report
        if: matrix.coverage && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: packages/polite-crawler/coverage/
          if-no-files-found: ignore
          retention-days: 14

      # The npm build, packed and installed into an empty project the way a user gets it
      - run: pnpm --filter polite-crawler build
      - run: node scripts/smoke.mjs

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # oxlint, with the type-aware rules (no-floating-promises, no-misused-promises)
      - run: pnpm lint
      # The writing rules (ASD-STE100) of the README files and the doc comments
      - run: pnpm lint:ste
      # A change to the site fails here, and not later in the Pages deployment.
      - name: Build the site
        run: pnpm --filter @crawler/site run build
        env:
          SITE_BASE: /crawler
          ASTRO_TELEMETRY_DISABLED: "1"
