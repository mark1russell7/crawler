name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The browser for the renderer test. Without one, the test skips and proves nothing.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter polite-crawler exec playwright-core install --with-deps chromium-headless-shell
      - run: pnpm test
      # The writing rules (ASD-STE100) of the README files and the doc comments
      - run: pnpm lint:ste
      # The npm build of the package, and a run of its command line
      - run: pnpm --filter polite-crawler build
      - run: node packages/polite-crawler/build/cli.mjs --version
