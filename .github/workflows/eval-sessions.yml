# The eval "tokens per verified claim", part B (packages/polite-crawler/eval/README.md tells the method).
# Real sessions of Claude Code (claude -p) on the API: one session for each claim in each arm.
#   mcp        the MCP tools of polite-crawler-mcp, and no built-in tool
#   mcp-quote  the same server with --tools quote: only the four tools of a quote
#   webfetch   the built-in tool WebFetch, and no MCP server
# Each session costs money on the API. A dry run first:
#   gh workflow run eval-sessions.yml -R mark1russell7/crawler -f limit=2
# The artifact "eval-b" holds the records and the summary, and each arm has an artifact with the
# stream of each session. The job summary has the tables.
#
# It runs only when a person starts it. It never runs on a push or on a pull request, so no code of
# a fork gets the secret ANTHROPIC_API_KEY. Only the step "The sessions" gets the secret, and the
# sessions have no tool that runs a command.
name: Eval sessions

on:
  workflow_dispatch:
    inputs:
      arms:
        description: The arms, as a JSON list of mcp, mcp-quote and webfetch
        default: '["mcp","webfetch"]'
      mcp_version:
        description: The version of polite-crawler-mcp (mcp-quote needs 0.2.3 or later)
        default: "0.2.3"
      limit:
        description: The first N claims (empty for all)
        default: ""
      only:
        description: The claim ids, comma separated (empty for all)
        default: ""
      repeat:
        description: The sessions of each claim in each arm
        default: "1"
      model:
        description: The model of the two arms
        default: claude-sonnet-5-5
      budget:
        description: The limit of each arm in USD
        default: "20"
      max_turns:
        description: The limit of turns of one session
        default: "12"
      max_session_usd:
        description: The limit of one session in USD
        default: "1"
      summary_of:
        description: The id of an earlier run. Make only its summary again, with no sessions (empty for a new run).
        default: ""

permissions:
  contents: read
  # the summary downloads the records of an earlier run (summary_of)
  actions: read

# One run at a time, so two runs never fetch from the same sites at the same time.
concurrency:
  group: eval-sessions
  cancel-in-progress: false

env:
  # Claude Code and polite-crawler-mcp at fixed versions, so that a run can be done again
  CLAUDE_CODE_VERSION: 2.1.312
  MCP_VERSION: ${{ inputs.mcp_version }}

jobs:
  arm:
    name: Sessions (${{ matrix.arm }})
    if: inputs.summary_of == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # No more than two jobs at the same time: each site gets no more than two sessions at a time
      max-parallel: 2
      matrix:
        arm: ${{ fromJSON(inputs.arms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Claude Code and polite-crawler-mcp
        run: |
          npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          npm install --prefix "$RUNNER_TEMP/mcp" "polite-crawler-mcp@$MCP_VERSION"
          claude --version
          test -x "$RUNNER_TEMP/mcp/node_modules/.bin/polite-crawler-mcp"

      - name: The sessions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: "1"
          ARM: ${{ matrix.arm }}
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
          REPEAT: ${{ inputs.repeat }}
          MODEL: ${{ inputs.model }}
          BUDGET: ${{ inputs.budget }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MAX_SESSION_USD: ${{ inputs.max_session_usd }}
        run: >-
          pnpm exec tsx packages/polite-crawler/eval/sessions.mts run
          --arm "$ARM" --model "$MODEL" --limit "$LIMIT" --only "$ONLY" --repeat "$REPEAT"
          --budget "$BUDGET" --max-turns "$MAX_TURNS" --max-budget-usd "$MAX_SESSION_USD"
          --mcp-command "$RUNNER_TEMP/mcp/node_modules/.bin/polite-crawler-mcp"
          --out sessions

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sessions-${{ matrix.arm }}
          path: sessions/${{ matrix.arm }}/
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Summary
    needs: arm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sessions-*
          path: downloaded
          run-id: ${{ inputs.summary_of || github.run_id }}
          github-token: ${{ github.token }}
      - name: The records of the two arms
        run: |
          mkdir -p sessions
          for arm in mcp mcp-quote webfetch; do
            if [ -d "downloaded/sessions-$arm" ]; then cp -r "downloaded/sessions-$arm" "sessions/$arm"; fi
          done
      # The summary fetches each page one time (robots.txt, the pace of each site), and checks that
      # each quote of each answer is on the page.
      - name: The summary
        run: >-
          pnpm exec tsx packages/polite-crawler/eval/sessions.mts summary
          --out sessions --fetch --markdown sessions/eval-b-summary.md --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: eval-b
          path: |
            sessions/eval-b-result.json
            sessions/eval-b-summary.md
          if-no-files-found: warn
          retention-days: 90
