# The security scans of this repository in one job: the action security-scan of mark1russell7/template
# (CI.md, "Security"): dependency review and osv-scanner. A pull request fails only for a new finding at
# or above high. Pushes to main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "10 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one check of this file that the ruleset names, next to CI OK (CI.md of mark1russell7/template,
  # "The check of the ruleset"). The scans stay out of ci.yml, because release.yml calls ci.yml with
  # contents: read and actions: read only.
  security-ok:
    name: Security OK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mark1russell7/template/.github/actions/security-scan@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          # The default setup of code scanning already analyzes this repository with CodeQL
          codeql: false
