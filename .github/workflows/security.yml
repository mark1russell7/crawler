# The security scans of this repository: dependency review, osv-scanner and CodeQL (CI.md of
# mark1russell7/template). A pull request fails only for a new finding at or above high. Pushes to
# main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "10 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: mark1russell7/template/.github/workflows/reusable-security.yml@5b6d568175b98264391a21a9da059df7be51d85e # main
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      # The default setup of code scanning already analyzes this repository with CodeQL
      codeql: false
