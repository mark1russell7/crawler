<!doctype html>
<!-- The share card of the site (Open Graph and Twitter), 1200 by 630. scripts/og-image.mjs renders it to public/og.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #151c2e;
        --ink-2: #454f67;
        --paper: #f5f6f9;
        --grid: #e2e6ee;
        --accent: #2346c4;
        --warn: #fab219;
        --mark: #c2301f;
        --rule: #aeb6c7;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 60px 72px;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 30px;
        font-weight: 700;
        color: var(--accent);
      }
      .name svg {
        width: 52px;
        height: 52px;
      }
      h1 {
        margin-top: 30px;
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -2.5px;
        line-height: 1;
        white-space: nowrap;
      }
      .sub {
        margin-top: 22px;
        font-size: 28px;
        line-height: 1.35;
        color: var(--ink-2);
        max-width: 980px;
      }
      .lanes {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        display: grid;
        gap: 14px;
        padding: 22px 26px;
        background: #fff;
        border: 2px solid var(--ink);
        border-top-width: 5px;
        border-radius: 0 0 10px 10px;
      }
      .lane {
        display: grid;
        grid-template-columns: 210px 1fr;
        align-items: center;
        gap: 18px;
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 19px;
      }
      .track {
        position: relative;
        height: 12px;
      }
      .req {
        position: absolute;
        top: 0;
        height: 12px;
        border-radius: 6px;
        background: var(--accent);
      }
      .rest {
        position: absolute;
        top: 5px;
        height: 0;
        border-top: 3px dotted var(--rule);
      }
      .warn {
        background: var(--warn);
      }
      .stop {
        background: var(--mark);
      }
      .x {
        position: absolute;
        top: -12px;
        font:
          700 28px "Segoe UI",
          sans-serif;
        color: var(--mark);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="name">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#151c2e" />
          <rect x="5" y="7.5" width="8" height="3.5" rx="1.75" fill="#93abff" />
          <circle cx="16" cy="9.25" r="1" fill="#6f7aa3" />
          <circle cx="19.5" cy="9.25" r="1" fill="#6f7aa3" />
          <rect x="22" y="7.5" width="5" height="3.5" rx="1.75" fill="#93abff" />
          <rect x="9" y="14.25" width="10" height="3.5" rx="1.75" fill="#93abff" />
          <circle cx="22.5" cy="16" r="1" fill="#6f7aa3" />
          <rect x="5" y="21" width="5" height="3.5" rx="1.75" fill="#93abff" />
          <path d="M14 25.5l5-6" stroke="#ff7b6b" stroke-width="2" stroke-linecap="round" />
        </svg>
        polite-crawler
      </div>
      <h1>Fetch once. Read many times.</h1>
      <p class="sub">
        A polite web crawler for research and AI agents: robots.txt obeyed, one request at a time
        per site, a local full-text index and an MCP server.
      </p>
      <div class="lanes">
        <div class="lane">
          <span>en.wikipedia.org</span>
          <div class="track">
            <span class="req" style="left: 0%; width: 3%"></span
            ><span class="rest" style="left: 3%; width: 15%"></span
            ><span class="req" style="left: 18%; width: 3%"></span
            ><span class="rest" style="left: 21%; width: 15%"></span
            ><span class="req" style="left: 36%; width: 3%"></span
            ><span class="rest" style="left: 39%; width: 15%"></span
            ><span class="req" style="left: 54%; width: 3%"></span>
          </div>
        </div>
        <div class="lane">
          <span>api.busy.example</span>
          <div class="track">
            <span class="req" style="left: 0%; width: 2%"></span
            ><span class="rest" style="left: 2%; width: 14%"></span
            ><span class="req warn" style="left: 16%; width: 2%"></span
            ><span class="rest" style="left: 18%; width: 44%; border-top-color: #fab219"></span
            ><span class="req" style="left: 62%; width: 2%"></span>
          </div>
        </div>
        <div class="lane">
          <span>shop.example</span>
          <div class="track">
            <span class="req stop" style="left: 0%; width: 3%"></span
            ><span class="x" style="left: 4.5%">×</span><span class="x" style="left: 7%">×</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
