<!doctype html>
<!-- The share card of the robots.txt study, 1200 by 630. scripts/og-image.mjs renders it to public/og-robots-study.png and gives it the verdicts of GPTBot. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --ink: #151c2e; --ink-2: #454f67; --paper: #f5f6f9; --grid: #e2e6ee; --accent: #2346c4; --mark: #c2301f; --star: #ec9a8f; --open: #dfe3eb; --none: #aeb6c7; }
      * { box-sizing: border-box; margin: 0; }
      body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
      .card { position: relative; display: grid; grid-template-columns: 1fr 470px; gap: 56px; width: 1200px; height: 630px; padding: 58px 64px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
      .name { display: flex; align-items: center; gap: 14px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 26px; font-weight: 700; color: var(--accent); }
      .name svg { width: 44px; height: 44px; }
      h1 { margin-top: 34px; font-size: 70px; font-weight: 800; letter-spacing: -2px; line-height: 1.02; }
      .sub { margin-top: 24px; font-size: 27px; line-height: 1.36; color: var(--ink-2); }
      .stat { margin-top: 30px; font-size: 25px; line-height: 1.35; }
      .stat b { color: var(--mark); }
      .panel { align-self: center; padding: 20px; background: #fff; border: 2px solid var(--ink); border-top-width: 5px; border-radius: 0 0 10px 10px; }
      .panel-head { display: flex; justify-content: space-between; font-family: Consolas, "Cascadia Mono", monospace; font-size: 18px; margin-bottom: 14px; }
      .grid { display: grid; grid-template-columns: repeat(40, 1fr); gap: 2px; }
      .grid span { aspect-ratio: 1; border-radius: 1.5px; background: var(--open); }
      .grid .N { background: var(--mark); }
      .grid .S { background: var(--star); }
      .grid .n { background: var(--accent); }
      .grid .U { background: transparent; box-shadow: inset 0 0 0 1.5px var(--none); }
      .key { display: flex; gap: 18px; margin-top: 14px; font-size: 17px; color: var(--ink-2); }
      .key i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <div class="name">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="6" fill="#151c2e" />
            <rect x="5" y="7.5" width="8" height="3.5" rx="1.75" fill="#93abff" />
            <circle cx="16" cy="9.25" r="1" fill="#6f7aa3" /><circle cx="19.5" cy="9.25" r="1" fill="#6f7aa3" />
            <rect x="22" y="7.5" width="5" height="3.5" rx="1.75" fill="#93abff" />
            <rect x="9" y="14.25" width="10" height="3.5" rx="1.75" fill="#93abff" />
            <circle cx="22.5" cy="16" r="1" fill="#6f7aa3" />
            <rect x="5" y="21" width="5" height="3.5" rx="1.75" fill="#93abff" />
            <path d="M14 25.5l5-6" stroke="#ff7b6b" stroke-width="2" stroke-linecap="round" />
          </svg>
          polite-crawler field note
        </div>
        <h1>Who lets AI agents in?</h1>
        <p class="sub">The robots.txt files of the top 1,000 domains, read on <span id="date"></span>.</p>
        <p class="stat"><b id="share"></b> of the sites refuse GPTBot. Fewer refuse the agents that fetch a page for a person.</p>
      </div>
      <div class="panel">
        <div class="panel-head"><span>GPTBot</span><span>one square = one domain</span></div>
        <div class="grid" id="grid"></div>
        <div class="key"><span><i style="background:var(--mark)"></i>refused by name</span><span><i style="background:var(--star)"></i>all bots</span><span><i style="background:var(--accent)"></i>permitted by name</span></div>
      </div>
    </div>
    <script>
      // og-image.mjs sets window.study before the page loads: { date, share, codes }
      const study = window.study;
      document.getElementById("date").textContent = study.date;
      document.getElementById("share").textContent = study.share;
      document.getElementById("grid").innerHTML = study.codes.map((code) => `<span class="${code === "." ? "" : code}"></span>`).join("");
    </script>
  </body>
</html>
