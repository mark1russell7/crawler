packages:
  - "packages/*"

# Packages allowed to run install scripts. Since pnpm 11 every other package that has one fails the install.
# A git-hosted package is approved by its repository URL, so a new commit of cue needs no new approval.
allowBuilds:
  "@mark1russell7/cue@git+https://github.com/mark1russell7/cue.git": true
  esbuild: true
  # The optional peer @huggingface/transformers (a devDependency for its CI test) needs no script:
  # onnxruntime-node holds the CPU binaries, and its script only gets the CUDA binaries.
  onnxruntime-node: false
  protobufjs: false

# The release age does not apply to the packages of the owner of this repository: the shared MCP
# host of @procedures/mcp-server is a first-party dependency, as in the client repository.
minimumReleaseAgeExclude:
  - zod@4.6.6
  - "@procedures/client@0.14.1"
  - "@procedures/mcp@0.14.1"
  - "@procedures/mcp-server@0.14.1"
  - "@procedures/client@0.14.1"
  - "@procedures/mcp-server@0.14.1"
  - "@procedures/mcp@0.14.1"
