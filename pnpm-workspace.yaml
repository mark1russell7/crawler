packages:
  - "packages/*"

# Packages allowed to run install scripts. Since pnpm 11 every other package that has one fails the install.
# A git-hosted package is approved by its repository URL, so a new commit of cue needs no new approval.
allowBuilds:
  "@mark1russell7/cue@git+https://github.com/mark1russell7/cue.git": true
  esbuild: true
  # The optional peer @huggingface/transformers (a devDependency for its CI test) needs no script:
  # onnxruntime-node holds the CPU binaries, and its script only gets the CUDA binaries.
  onnxruntime-node: false
  protobufjs: false

# The release age does not apply to the packages of the owner of this repository: the shared MCP
# host of @procedures/mcp-server is a first-party dependency, as in the client repository.
minimumReleaseAgeExclude:
  # Our own packages: the release train updates them, so the release age check of pnpm does not apply to them.
  - "@mark1russell7/*"
  - "@procedures/*"
  - zod@4.6.6

# An install fails when a new version has less trust evidence than an earlier version of the same package: for
# example, a version with no provenance after versions from a trusted publisher. Such a version can be a stolen token.
trustPolicy: no-downgrade
# The check examines the versions of the last 7 days. A stolen-token version is new, and the registry removes it in
# hours. Older versions can have less evidence for other reasons: for example undici-types 6.21.0 under @types/node.
trustPolicyIgnoreAfter: 10080

# The release train updates our own scopes, and it checks the provenance of each version. pnpm cannot use them: it
# ranks the first versions, which were staged by hand, above the versions from release.yml (pnpm/pnpm#16689).
trustPolicyExclude:
  - "@mark1russell7/*"
  - "@procedures/*"

overrides:
  # The advisory GHSA-g3hv-75wg-m249 covers minimatch 7.0.0 to 11.0.0, with no fix in 10.x. @microsoft/api-extractor
  # 7.60.1 pins minimatch 10.2.3, and it calls only minimatch(name, pattern) on package names. The check:api run
  # passes with minimatch 11. End: remove this override when api-extractor depends on minimatch 11.0.1 or later.
  "@microsoft/api-extractor>minimatch": ^11.0.1
